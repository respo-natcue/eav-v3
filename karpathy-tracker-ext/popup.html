<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karpathy Updates</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="profile">
        <img src="assets/icon-48.png" alt="Karpathy" class="avatar">
        <div>
          <h1>Andrej Karpathy</h1>
          <p class="subtitle">Latest Updates & Thoughts</p>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="blogs">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        Blog Posts
      </button>
      <button class="tab-btn" data-tab="x-posts">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l11.733 16h4.267l-11.733 -16z"/><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/></svg>
        X (Twitter)
      </button>
    </nav>

    <div class="content-area">
      <div id="blogs" class="tab-content active">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Fetching latest blogs...</p>
        </div>
        <div id="blog-list" class="item-list"></div>
      </div>

      <div id="x-posts" class="tab-content">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Fetching latest tweets...</p>
        </div>
        <div id="tweet-list" class="item-list"></div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
